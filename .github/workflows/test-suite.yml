name: Test Suite

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]

jobs:
  backend-and-frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: "16"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-benchmark

      - name: Run backend integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}/catanatron_server:${{ github.workspace }}/catanatron_core:${{ github.workspace }}/catanatron_experimental:${{ github.workspace }}/catanatron_gym
        run: |
          python -m pytest \
            tests/integration_tests/test_server.py \
            tests/integration_tests/test_model_registry.py \
            tests/integration_tests/test_auth.py \
            tests/integration_tests/test_history.py \
            tests/integration_tests/test_game_constraints.py \
            tests/integration_tests/test_realtime.py \
            -q

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Run frontend tests
        working-directory: ui
        run: CI=1 npm test -- --watchAll=false --runInBand
