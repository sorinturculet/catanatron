      <stop offset="0%" stop-color="#D05030"/>
      <stop offset="60%" stop-color="#B83C22"/>
      <stop offset="100%" stop-color="#942C1C"/>
    </linearGradient>
    <!-- Brick color variant C (lighter/warmer) -->
