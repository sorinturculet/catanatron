      <stop offset="0%" stop-color="#E86040"/>
      <stop offset="60%" stop-color="#D05030"/>
      <stop offset="100%" stop-color="#AC3828"/>
    </linearGradient>
    <!-- Subtle top highlight for each brick -->
    <linearGradient id="bh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

