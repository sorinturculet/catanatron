<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 346 400">
  <defs>
    <clipPath id="hex">
      <polygon points="-0.2,100 -0.2,300 173,400 346.2,300 346.2,100 173,0"/>
    </clipPath>
    <!-- Sky gradient (top portion) -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F5D88A"/>
      <stop offset="100%" stop-color="#E8B84B"/>
    </linearGradient>
    <!-- Sand base gradient -->
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E8C060"/>
      <stop offset="100%" stop-color="#C89030"/>
    </linearGradient>
    <!-- Dune shadow (darker underside) -->
    <linearGradient id="dune1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E8C060"/>
      <stop offset="100%" stop-color="#B07828"/>
    </linearGradient>
    <linearGradient id="dune2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#D4A840"/>
      <stop offset="100%" stop-color="#986018"/>
    </linearGradient>
    <linearGradient id="dune3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#EAC858"/>
      <stop offset="100%" stop-color="#B88020"/>
    </linearGradient>
    <!-- Highlight streak on dune crest -->
    <linearGradient id="crest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFF0B0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0B0" stop-opacity="0"/>
    </linearGradient>
    <!-- Sun glow -->
    <radialGradient id="sun" cx="68%" cy="18%" r="14%">
      <stop offset="0%"   stop-color="#FFFDE0" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#FFE060" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFE060" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#hex)">

    <!-- Sky fill -->
    <rect x="-1" y="0" width="348" height="400" fill="url(#sky)"/>

    <!-- Sun glow -->
    <rect x="-1" y="0" width="348" height="400" fill="url(#sun)"/>

    <!-- === BACK DUNE (widest, furthest) === -->
    <!-- body -->
    <path d="M -10,280
             C 30,210 90,190 160,195
             C 220,200 270,220 346,240
             L 346,400 L -10,400 Z"
          fill="url(#dune2)"/>
    <!-- crest highlight -->
    <path d="M -10,280
             C 30,210 90,190 160,195
             C 220,200 270,220 346,240
             C 270,228 220,208 160,203
             C 90,198 30,218 -10,288 Z"
          fill="url(#crest)" opacity="0.5"/>

    <!-- === MID DUNE === -->
    <!-- body -->
    <path d="M -10,320
             C 40,255 110,235 190,245
             C 250,252 295,270 356,255
             L 356,400 L -10,400 Z"
          fill="url(#dune1)"/>
    <!-- crest highlight -->
    <path d="M -10,320
             C 40,255 110,235 190,245
             C 250,252 295,270 356,255
             C 295,262 250,244 190,237
             C 110,227 40,247 -10,312 Z"
          fill="url(#crest)" opacity="0.55"/>

    <!-- === FRONT DUNE (closest, lowest horizon) === -->
    <!-- body -->
    <path d="M -10,360
             C 50,305 120,288 200,296
             C 260,302 310,322 356,308
             L 356,400 L -10,400 Z"
          fill="url(#dune3)"/>
    <!-- crest highlight -->
    <path d="M -10,360
             C 50,305 120,288 200,296
             C 260,302 310,322 356,308
             C 310,316 260,296 200,290
             C 120,282 50,299 -10,354 Z"
          fill="url(#crest)" opacity="0.6"/>

    <!-- === FOREGROUND SAND FLOOR === -->
    <rect x="-1" y="370" width="348" height="32" fill="url(#sand)"/>

    <!-- === SMALL RIPPLE LINES (wind texture) === -->
    <g opacity="0.18" stroke="#7A4A00" stroke-width="1" fill="none">
      <path d="M 20,345 Q 80,338 140,343 Q 180,346 230,340 Q 280,335 330,342"/>
      <path d="M 10,355 Q 70,348 140,353 Q 190,357 250,350 Q 300,344 346,351"/>
      <path d="M 0,380  Q 60,373 130,378 Q 190,382 260,375 Q 310,370 346,376"/>
      <path d="M 0,390  Q 50,384 110,389 Q 170,393 240,386 Q 300,381 346,387"/>
    </g>

    <!-- === CACTUS (subtle, back-left) === -->
    <g transform="translate(68, 230)" opacity="0.82">
      <!-- main trunk -->
      <rect x="-4" y="-52" width="8" height="52" rx="4" fill="#5A8A30"/>
      <!-- left arm -->
      <path d="M -4,-30 Q -22,-30 -22,-14 L -14,-14 Q -14,-22 -4,-22 Z" fill="#5A8A30"/>
      <rect x="-22" y="-42" width="8" height="28" rx="4" fill="#5A8A30"/>
      <!-- right arm -->
      <path d="M 4,-22 Q 20,-22 20,-8 L 12,-8 Q 12,-14 4,-14 Z" fill="#5A8A30"/>
      <rect x="14" y="-34" width="8" height="26" rx="4" fill="#5A8A30"/>
      <!-- spine dots -->
      <g fill="#7AB840" opacity="0.7">
        <circle cx="0" cy="-48" r="1.5"/>
        <circle cx="0" cy="-38" r="1.5"/>
        <circle cx="0" cy="-28" r="1.5"/>
        <circle cx="-18" cy="-38" r="1.2"/>
        <circle cx="-18" cy="-28" r="1.2"/>
        <circle cx="18" cy="-28" r="1.2"/>
        <circle cx="18" cy="-18" r="1.2"/>
      </g>
    </g>

  </g>
</svg>
