<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 346 400">
  <defs>
    <clipPath id="hex">
      <polygon points="-0.2,100 -0.2,300 173,400 346.2,300 346.2,100 173,0"/>
    </clipPath>
    <!-- Deep ocean gradient -->
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2A6EA8"/>
      <stop offset="50%"  stop-color="#1A4E80"/>
      <stop offset="100%" stop-color="#0E2F52"/>
    </linearGradient>
    <!-- Wave highlight (bright crest) -->
    <linearGradient id="wcrest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#A8D8F8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A8D8F8" stop-opacity="0"/>
    </linearGradient>
    <!-- Wave body -->
    <linearGradient id="wbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3A88C8"/>
      <stop offset="100%" stop-color="#1A5888"/>
    </linearGradient>
    <!-- Sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#A8D0F0"/>
      <stop offset="100%" stop-color="#4A98D8"/>
    </linearGradient>
    <!-- Sun shimmer on water -->
    <radialGradient id="shimmer" cx="60%" cy="35%" r="40%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Sail gradient -->
    <linearGradient id="sail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F8F0D8"/>
      <stop offset="100%" stop-color="#D8C898"/>
    </linearGradient>
    <!-- Hull gradient -->
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8B3A1A"/>
      <stop offset="100%" stop-color="#5A2010"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#hex)">

    <!-- Sky -->
    <rect x="-1" y="0" width="348" height="220" fill="url(#sky)"/>

    <!-- Horizon line / ocean base -->
    <rect x="-1" y="210" width="348" height="192" fill="url(#ocean)"/>

    <!-- Sun shimmer reflection -->
    <rect x="-1" y="210" width="348" height="192" fill="url(#shimmer)"/>

    <!-- === WAVES (back to front, progressively larger) === -->

    <!-- Wave row 1 (far back) -->
    <path d="M -10,248
             C 20,240 50,240 80,248
             C 110,256 140,256 170,248
             C 200,240 230,240 260,248
             C 290,256 320,256 356,248
             L 356,260
             C 320,268 290,268 260,260
             C 230,252 200,252 170,260
             C 140,268 110,268 80,260
             C 50,252 20,252 -10,260 Z"
          fill="url(#wbody)" opacity="0.7"/>
    <path d="M -10,248 C 20,240 50,240 80,248 C 110,256 140,256 170,248 C 200,240 230,240 260,248 C 290,256 320,256 356,248
             C 320,244 290,244 260,244 C 230,244 200,244 170,244 C 140,244 110,244 80,244 C 50,244 20,244 -10,244 Z"
          fill="url(#wcrest)" opacity="0.6"/>

    <!-- Wave row 2 -->
    <path d="M -10,275
             C 25,265 60,265 95,275
             C 130,285 165,285 200,275
             C 235,265 270,265 310,275
             L 356,270
             L 356,288
             C 310,292 270,283 235,283
             C 200,288 165,298 130,298
             C 95,289 60,279 25,279
             L -10,289 Z"
          fill="url(#wbody)" opacity="0.8"/>
    <path d="M -10,275 C 25,265 60,265 95,275 C 130,285 165,285 200,275 C 235,265 270,265 310,275 L 356,270
             C 310,266 270,260 235,260 C 200,266 165,275 130,274 C 95,271 60,260 25,261 L -10,271 Z"
          fill="url(#wcrest)" opacity="0.65"/>

    <!-- Wave row 3 -->
    <path d="M -10,305
             C 30,293 70,293 110,305
             C 150,317 190,317 230,305
             C 270,293 310,293 356,300
             L 356,322
             C 310,314 270,308 230,320
             C 190,332 150,332 110,320
             C 70,308 30,308 -10,320 Z"
          fill="url(#wbody)" opacity="0.85"/>
    <path d="M -10,305 C 30,293 70,293 110,305 C 150,317 190,317 230,305 C 270,293 310,293 356,300
             C 310,295 270,288 230,300 C 190,311 150,311 110,299 C 70,288 30,288 -10,300 Z"
          fill="url(#wcrest)" opacity="0.7"/>

    <!-- Wave row 4 (closest, largest) -->
    <path d="M -10,340
             C 35,325 80,325 125,340
             C 170,355 210,355 255,340
             C 295,326 320,326 356,335
             L 356,362
             C 320,352 295,345 255,358
             C 210,372 170,372 125,358
             C 80,344 35,344 -10,358 Z"
          fill="url(#wbody)"/>
    <path d="M -10,340 C 35,325 80,325 125,340 C 170,355 210,355 255,340 C 295,326 320,326 356,335
             C 320,329 295,320 255,333 C 210,348 170,348 125,333 C 80,319 35,319 -10,334 Z"
          fill="url(#wcrest)" opacity="0.75"/>

    <!-- Foam/spray flecks on wave 4 -->
    <g fill="#FFFFFF" opacity="0.55">
      <ellipse cx="60"  cy="333" rx="7" ry="2"/>
      <ellipse cx="130" cy="340" rx="5" ry="1.5"/>
      <ellipse cx="200" cy="335" rx="8" ry="2"/>
      <ellipse cx="270" cy="337" rx="6" ry="1.5"/>
      <ellipse cx="320" cy="332" rx="5" ry="1.5"/>
    </g>

    <!-- === SAILING SHIP === -->
    <g transform="translate(173, 195)">

      <!-- Mast -->
      <rect x="-2" y="-130" width="4" height="115" rx="2" fill="#6B3A10"/>

      <!-- Main sail (big) -->
      <path d="M 0,-125 L 52,-60 L 0,-10 Z" fill="url(#sail)" opacity="0.95"/>
      <path d="M 0,-125 L -52,-60 L 0,-10 Z" fill="url(#sail)" opacity="0.85"/>

      <!-- Top sail (small) -->
      <path d="M 0,-125 L 22,-100 L 0,-90 Z" fill="#F8F0D8" opacity="0.9"/>
      <path d="M 0,-125 L -22,-100 L 0,-90 Z" fill="#E8E0C8" opacity="0.9"/>

      <!-- Boom / horizontal spar -->
      <rect x="-54" y="-12" width="108" height="3" rx="1.5" fill="#6B3A10"/>

      <!-- Hull -->
      <path d="M -54,-10 L 54,-10 L 44,18 L -44,18 Z" fill="url(#hull)"/>
      <!-- Hull highlight -->
      <path d="M -54,-10 L 54,-10 L 48,-2 L -48,-2 Z" fill="#B0501C" opacity="0.5"/>
      <!-- Waterline stripe -->
      <path d="M -44,16 L 44,16 L 42,20 L -42,20 Z" fill="#C8880A" opacity="0.8"/>

      <!-- Crow's nest -->
      <rect x="-7" y="-100" width="14" height="8" rx="2" fill="#7A4A18"/>

      <!-- Flag -->
      <path d="M 2,-128 L 22,-120 L 2,-112 Z" fill="#CC2020"/>

      <!-- Rigging lines -->
      <g stroke="#8B6030" stroke-width="1" opacity="0.6" fill="none">
        <line x1="0" y1="-125" x2="-54" y2="-12"/>
        <line x1="0" y1="-125" x2="54" y2="-12"/>
        <line x1="0" y1="-90"  x2="-54" y2="-12"/>
        <line x1="0" y1="-90"  x2="54" y2="-12"/>
      </g>

    </g>

    <!-- Water reflection of ship (subtle) -->
    <g transform="translate(173, 215) scale(1, -0.3)" opacity="0.18">
      <path d="M -54,-10 L 54,-10 L 44,18 L -44,18 Z" fill="#6B3A10"/>
      <rect x="-2" y="-80" width="4" height="72" fill="#6B3A10"/>
      <path d="M 0,-78 L 40,-38 L 0,-6 L -40,-38 Z" fill="#D8C888"/>
    </g>

  </g>
</svg>
