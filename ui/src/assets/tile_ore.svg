<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 346 400">
  <defs>
    <clipPath id="hex">
      <polygon points="-0.2,100 -0.2,300 173,400 346.2,300 346.2,100 173,0"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C8D4E0"/>
      <stop offset="100%" stop-color="#98B0C8"/>
    </linearGradient>
    <linearGradient id="mtnBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#9898A8"/>
      <stop offset="100%" stop-color="#606068"/>
    </linearGradient>
    <linearGradient id="mtnMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7A7A88"/>
      <stop offset="100%" stop-color="#484850"/>
    </linearGradient>
    <linearGradient id="mtnFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#686874"/>
      <stop offset="100%" stop-color="#3A3A42"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FAFCFF"/>
      <stop offset="100%" stop-color="#D8E4F0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#hex)">

    <!-- Sky -->
    <rect x="-1" y="0" width="348" height="400" fill="url(#sky)"/>

    <!-- Back mountain (center, tallest) -->
    <polygon points="173,35 290,310 56,310" fill="url(#mtnBack)"/>
    <!-- back mountain shadow face -->
    <polygon points="173,35 290,310 173,310" fill="#3A3A44" opacity="0.35"/>
    <!-- snow cap -->
    <polygon points="173,35 212,118 173,130 134,118" fill="url(#snow)"/>
    <polygon points="173,130 212,118 173,124" fill="#C8D8E8" opacity="0.5"/>

    <!-- Left mountain -->
    <polygon points="72,115 178,310 -20,310" fill="url(#mtnMid)"/>
    <polygon points="72,115 178,310 72,310" fill="#30303A" opacity="0.3"/>
    <!-- snow -->
    <polygon points="72,115 98,178 72,187 46,178" fill="url(#snow)" opacity="0.9"/>

    <!-- Right mountain -->
    <polygon points="274,108 368,310 168,310" fill="url(#mtnMid)"/>
    <polygon points="274,108 368,310 274,310" fill="#30303A" opacity="0.3"/>
    <!-- snow -->
    <polygon points="274,108 300,171 274,180 248,171" fill="url(#snow)" opacity="0.9"/>

    <!-- Front rock mass (ground level) -->
    <path d="M -10,318 C 50,305 110,310 173,308 C 236,306 296,312 356,302 L 356,400 L -10,400 Z"
          fill="url(#mtnFront)"/>
    <!-- ground highlight -->
    <path d="M -10,318 C 50,305 110,310 173,308 C 236,306 296,312 356,302
             C 296,306 236,312 173,314 C 110,316 50,311 -10,324 Z"
          fill="#888898" opacity="0.4"/>

  </g>
</svg>
