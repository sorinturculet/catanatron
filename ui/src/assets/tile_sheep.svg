<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 346 400">
  <defs>
    <clipPath id="hex">
      <polygon points="-0.2,100 -0.2,300 173,400 346.2,300 346.2,100 173,0"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7ACC30"/>
      <stop offset="100%" stop-color="#4A9010"/>
    </linearGradient>

    <!-- Small sheep — origin (0,0) = ground, faces right -->
    <g id="sS">
      <ellipse cx="0"  cy="-11" rx="13" ry="8"   fill="#F0EEE8"/>
      <ellipse cx="-5" cy="-13" rx="9"  ry="7"   fill="#E8E6E0"/>
      <ellipse cx="5"  cy="-14" rx="8"  ry="6"   fill="#F4F2EC"/>
      <ellipse cx="12" cy="-14" rx="5"  ry="4.5" fill="#D0C8A8"/>
      <circle  cx="13.5" cy="-15.5" r="1.2" fill="#2A2010"/>
      <rect x="-8" y="-5"  width="2.5" height="6" rx="1.2" fill="#B8B098"/>
      <rect x="-3" y="-5"  width="2.5" height="6" rx="1.2" fill="#B8B098"/>
      <rect x="3"  y="-5"  width="2.5" height="6" rx="1.2" fill="#B8B098"/>
      <rect x="7"  y="-5"  width="2.5" height="6" rx="1.2" fill="#B8B098"/>
    </g>

    <!-- Medium sheep — faces right -->
    <g id="sM">
      <ellipse cx="0"  cy="-14" rx="17" ry="11" fill="#F0EEE8"/>
      <ellipse cx="-6" cy="-16" rx="11" ry="9"  fill="#E8E6E0"/>
      <ellipse cx="6"  cy="-17" rx="10" ry="8"  fill="#F4F2EC"/>
      <ellipse cx="15" cy="-18" rx="7"  ry="6"  fill="#D0C8A8"/>
      <circle  cx="17" cy="-20" r="1.5" fill="#2A2010"/>
      <rect x="-10" y="-6" width="3" height="8" rx="1.5" fill="#B8B098"/>
      <rect x="-4"  y="-6" width="3" height="8" rx="1.5" fill="#B8B098"/>
      <rect x="3"   y="-6" width="3" height="8" rx="1.5" fill="#B8B098"/>
      <rect x="9"   y="-6" width="3" height="8" rx="1.5" fill="#B8B098"/>
    </g>

    <!-- Large sheep — faces right -->
    <g id="sL">
      <ellipse cx="0"  cy="-19" rx="22" ry="14" fill="#F4F2EC"/>
      <ellipse cx="-8" cy="-22" rx="14" ry="11" fill="#ECEAE4"/>
      <ellipse cx="7"  cy="-23" rx="13" ry="10" fill="#F8F6F0"/>
      <ellipse cx="19" cy="-24" rx="9"  ry="8"  fill="#D8D0B0"/>
      <circle  cx="22" cy="-27" r="2"   fill="#2A2010"/>
      <rect x="-13" y="-8" width="4" height="9" rx="2" fill="#B8B098"/>
      <rect x="-5"  y="-8" width="4" height="9" rx="2" fill="#B8B098"/>
      <rect x="3"   y="-8" width="4" height="9" rx="2" fill="#B8B098"/>
      <rect x="11"  y="-8" width="4" height="9" rx="2" fill="#B8B098"/>
    </g>
  </defs>

  <g clip-path="url(#hex)">

    <!-- Meadow background -->
    <rect x="-1" y="0" width="348" height="400" fill="url(#bg)"/>

    <!-- === BACK HILL === -->
    <path d="M -10,215 C 40,170 105,158 173,164 C 241,170 306,162 356,172 L 356,400 L -10,400 Z"
          fill="#80C030"/>
    <!-- crest highlight -->
    <path d="M -10,215 C 40,170 105,158 173,164 C 241,170 306,162 356,172
             C 306,168 241,176 173,170 C 105,164 40,176 -10,221 Z"
          fill="#A8E050" opacity="0.45"/>

    <!-- Back sheep (small, on back hill) -->
    <g opacity="0.8">
      <use href="#sS" transform="translate(68,208)"/>
      <g transform="translate(178,204)"><use href="#sS" transform="scale(-1,1)"/></g>
      <use href="#sS" transform="translate(282,208)"/>
    </g>

    <!-- === MID HILL === -->
    <path d="M -10,272 C 50,230 118,220 173,226 C 228,232 296,224 356,236 L 356,400 L -10,400 Z"
          fill="#90D038"/>
    <!-- crest highlight -->
    <path d="M -10,272 C 50,230 118,220 173,226 C 228,232 296,224 356,236
             C 296,230 228,238 173,232 C 118,226 50,236 -10,278 Z"
          fill="#B8EC60" opacity="0.4"/>

    <!-- Mid sheep (medium, on mid hill) -->
    <g opacity="0.9">
      <g transform="translate(50,264)"><use href="#sM" transform="scale(-1,1)"/></g>
      <use href="#sM" transform="translate(160,259)"/>
      <g transform="translate(272,263)"><use href="#sM" transform="scale(-1,1)"/></g>
    </g>

    <!-- === FRONT HILL === -->
    <path d="M -10,336 C 55,296 124,286 173,292 C 222,298 292,290 356,302 L 356,400 L -10,400 Z"
          fill="#A0DC40"/>
    <!-- crest highlight -->
    <path d="M -10,336 C 55,296 124,286 173,292 C 222,298 292,290 356,302
             C 292,296 222,304 173,298 C 124,292 55,302 -10,342 Z"
          fill="#C8F068" opacity="0.4"/>

    <!-- Front sheep (large, on front hill) -->
    <use href="#sL" transform="translate(98,328)"/>
    <g transform="translate(238,324)"><use href="#sL" transform="scale(-1,1)"/></g>

  </g>
</svg>
