<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 346 400">
  <defs>
    <clipPath id="hex">
      <polygon points="-0.2,100 -0.2,300 173,400 346.2,300 346.2,100 173,0"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E8C030"/>
      <stop offset="40%"  stop-color="#C89018"/>
      <stop offset="100%" stop-color="#7A4808"/>
    </linearGradient>

    <!-- Small plant (back row) — origin (0,0) = ground, leans right -->
    <g id="pS">
      <path d="M 0,0 Q 5,-66 5,-132" stroke="#B87818" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 3,-72 Q 18,-66 22,-53" stroke="#C89020" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <ellipse cx="5"  cy="-144" rx="3.5" ry="12" fill="#EEC030"/>
      <ellipse cx="-2" cy="-149" rx="4"   ry="2"  fill="#D09818" transform="rotate(-30,-2,-149)"/>
      <ellipse cx="12" cy="-149" rx="4"   ry="2"  fill="#D09818" transform="rotate(30,12,-149)"/>
      <ellipse cx="-2" cy="-140" rx="4"   ry="2"  fill="#D09818" transform="rotate(-30,-2,-140)"/>
      <ellipse cx="12" cy="-140" rx="4"   ry="2"  fill="#D09818" transform="rotate(30,12,-140)"/>
      <line x1="-1"  y1="-153" x2="-9"  y2="-169" stroke="#987010" stroke-width="1"   stroke-linecap="round"/>
      <line x1="2"   y1="-155" x2="0"   y2="-172" stroke="#987010" stroke-width="1"   stroke-linecap="round"/>
      <line x1="5"   y1="-156" x2="5"   y2="-174" stroke="#987010" stroke-width="1"   stroke-linecap="round"/>
      <line x1="8"   y1="-155" x2="10"  y2="-172" stroke="#987010" stroke-width="1"   stroke-linecap="round"/>
      <line x1="11"  y1="-153" x2="19"  y2="-169" stroke="#987010" stroke-width="1"   stroke-linecap="round"/>
    </g>

    <!-- Medium plant (mid row) — leans right -->
    <g id="pM">
      <path d="M 0,0 Q 6,-84 6,-168" stroke="#A87010" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M 4,-90 Q 22,-83 27,-68" stroke="#C08818" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="6"  cy="-183" rx="4.5" ry="15"  fill="#F0C838"/>
      <ellipse cx="-2" cy="-190" rx="5"   ry="2.5" fill="#D09818" transform="rotate(-30,-2,-190)"/>
      <ellipse cx="14" cy="-190" rx="5"   ry="2.5" fill="#D09818" transform="rotate(30,14,-190)"/>
      <ellipse cx="-2" cy="-180" rx="5"   ry="2.5" fill="#D09818" transform="rotate(-30,-2,-180)"/>
      <ellipse cx="14" cy="-180" rx="5"   ry="2.5" fill="#D09818" transform="rotate(30,14,-180)"/>
      <ellipse cx="-1" cy="-170" rx="4"   ry="2"   fill="#D09818" transform="rotate(-30,-1,-170)"/>
      <ellipse cx="13" cy="-170" rx="4"   ry="2"   fill="#D09818" transform="rotate(30,13,-170)"/>
      <line x1="-1"  y1="-194" x2="-11" y2="-214" stroke="#987010" stroke-width="1.1" stroke-linecap="round"/>
      <line x1="3"   y1="-197" x2="1"   y2="-218" stroke="#987010" stroke-width="1.1" stroke-linecap="round"/>
      <line x1="6"   y1="-198" x2="6"   y2="-220" stroke="#987010" stroke-width="1.1" stroke-linecap="round"/>
      <line x1="9"   y1="-197" x2="11"  y2="-218" stroke="#987010" stroke-width="1.1" stroke-linecap="round"/>
      <line x1="13"  y1="-194" x2="23"  y2="-214" stroke="#987010" stroke-width="1.1" stroke-linecap="round"/>
    </g>

    <!-- Large plant (front row) — leans right -->
    <g id="pL">
      <path d="M 0,0 Q 8,-107 7,-215" stroke="#986008" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 5,-86  Q 26,-78  32,-60"  stroke="#B07818" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 6,-145 Q -18,-136 -24,-116" stroke="#B07818" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="7"  cy="-235"  rx="5.5" ry="20"  fill="#E8B828"/>
      <ellipse cx="-2" cy="-245"  rx="6.5" ry="3"   fill="#C89018" transform="rotate(-28,-2,-245)"/>
      <ellipse cx="16" cy="-245"  rx="6.5" ry="3"   fill="#C89018" transform="rotate(28,16,-245)"/>
      <ellipse cx="-2" cy="-234"  rx="6.5" ry="3"   fill="#C89018" transform="rotate(-28,-2,-234)"/>
      <ellipse cx="16" cy="-234"  rx="6.5" ry="3"   fill="#C89018" transform="rotate(28,16,-234)"/>
      <ellipse cx="-1" cy="-222"  rx="5.5" ry="2.5" fill="#C89018" transform="rotate(-28,-1,-222)"/>
      <ellipse cx="15" cy="-222"  rx="5.5" ry="2.5" fill="#C89018" transform="rotate(28,15,-222)"/>
      <line x1="-2"  y1="-251" x2="-14" y2="-277" stroke="#987010" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="2"   y1="-254" x2="-2"  y2="-281" stroke="#987010" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="5"   y1="-255" x2="3"   y2="-283" stroke="#987010" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="7"   y1="-256" x2="7"   y2="-284" stroke="#987010" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="9"   y1="-255" x2="11"  y2="-283" stroke="#987010" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="12"  y1="-254" x2="16"  y2="-281" stroke="#987010" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="16"  y1="-251" x2="28"  y2="-277" stroke="#987010" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>

  <g clip-path="url(#hex)">

    <!-- Field background -->
    <rect x="-1" y="0" width="348" height="400" fill="url(#bg)"/>

    <!-- BACK ROW (ground y=222) -->
    <g opacity="0.65">
      <use href="#pS" transform="translate(22,222)"/>
      <g transform="translate(68,222)"> <use href="#pS" transform="scale(-1,1)"/></g>
      <use href="#pS" transform="translate(114,222)"/>
      <g transform="translate(160,222)"><use href="#pS" transform="scale(-1,1)"/></g>
      <use href="#pS" transform="translate(206,222)"/>
      <g transform="translate(252,222)"><use href="#pS" transform="scale(-1,1)"/></g>
      <use href="#pS" transform="translate(298,222)"/>
    </g>

    <!-- Ground strip 1 -->
    <rect x="-1" y="214" width="348" height="15" fill="#6A3A08" opacity="0.55"/>

    <!-- MID ROW (ground y=278) -->
    <g opacity="0.85">
      <g transform="translate(44,278)"> <use href="#pM" transform="scale(-1,1)"/></g>
      <use href="#pM" transform="translate(90,278)"/>
      <g transform="translate(136,278)"><use href="#pM" transform="scale(-1,1)"/></g>
      <use href="#pM" transform="translate(182,278)"/>
      <g transform="translate(228,278)"><use href="#pM" transform="scale(-1,1)"/></g>
      <use href="#pM" transform="translate(274,278)"/>
      <g transform="translate(320,278)"><use href="#pM" transform="scale(-1,1)"/></g>
    </g>

    <!-- Ground strip 2 -->
    <rect x="-1" y="270" width="348" height="15" fill="#5A3008" opacity="0.55"/>

    <!-- FRONT ROW (ground y=342) -->
    <use href="#pL" transform="translate(28,342)"/>
    <g transform="translate(86,342)"> <use href="#pL" transform="scale(-1,1)"/></g>
    <use href="#pL" transform="translate(144,342)"/>
    <g transform="translate(202,342)"><use href="#pL" transform="scale(-1,1)"/></g>
    <use href="#pL" transform="translate(260,342)"/>
    <g transform="translate(318,342)"><use href="#pL" transform="scale(-1,1)"/></g>

    <!-- Ground strip 3 -->
    <rect x="-1" y="334" width="348" height="18" fill="#4A2808" opacity="0.6"/>

  </g>
</svg>
