<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 346 400">
  <defs>
    <clipPath id="hex">
      <polygon points="-0.2,100 -0.2,300 173,400 346.2,300 346.2,100 173,0"/>
    </clipPath>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4A7828"/>
      <stop offset="100%" stop-color="#2A4C10"/>
    </linearGradient>
    <linearGradient id="tBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5A8848"/>
      <stop offset="100%" stop-color="#3A6030"/>
    </linearGradient>
    <linearGradient id="tMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3A7828"/>
      <stop offset="100%" stop-color="#205018"/>
    </linearGradient>
    <linearGradient id="tFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2A6020"/>
      <stop offset="100%" stop-color="#163A10"/>
    </linearGradient>
    <linearGradient id="tShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#hex)">

    <!-- Forest floor background (full hex) -->
    <rect x="-1" y="0" width="348" height="400" fill="url(#ground)"/>

    <!-- === BACK TREES (start from very top) === -->
    <g fill="#4A2A10" opacity="0.6">
      <rect x="49"  y="158" width="6"  height="60" rx="3"/>
      <rect x="120" y="150" width="6"  height="68" rx="3"/>
      <rect x="173" y="145" width="7"  height="73" rx="3"/>
      <rect x="226" y="151" width="6"  height="67" rx="3"/>
      <rect x="293" y="158" width="6"  height="60" rx="3"/>
    </g>
    <polygon points="52,  20  22,162  82,162"  fill="url(#tBack)"/>
    <polygon points="52,  60  28,162  76,162"  fill="url(#tBack)" opacity="0.7"/>
    <polygon points="123, 12  90,155  156,155" fill="url(#tBack)"/>
    <polygon points="123, 52  96,155  150,155" fill="url(#tBack)" opacity="0.7"/>
    <polygon points="176,  8  140,152 212,152" fill="url(#tBack)"/>
    <polygon points="176, 48  144,152 208,152" fill="url(#tBack)" opacity="0.7"/>
    <polygon points="227, 14  194,155 260,155" fill="url(#tBack)"/>
    <polygon points="227, 54  198,155 256,155" fill="url(#tBack)" opacity="0.7"/>
    <polygon points="295, 22  265,162 325,162" fill="url(#tBack)"/>
    <polygon points="295, 62  270,162 320,162" fill="url(#tBack)" opacity="0.7"/>
    <polygon points="52,  20  52,162  82,162"  fill="url(#tShadow)"/>
    <polygon points="123, 12  123,155 156,155" fill="url(#tShadow)"/>
    <polygon points="176,  8  176,152 212,152" fill="url(#tShadow)"/>
    <polygon points="227, 14  227,155 260,155" fill="url(#tShadow)"/>
    <polygon points="295, 22  295,162 325,162" fill="url(#tShadow)"/>

    <!-- === MID TREES === -->
    <g fill="#3A2008" opacity="0.85">
      <rect x="14"  y="206" width="8"  height="72" rx="4"/>
      <rect x="90"  y="196" width="8"  height="82" rx="4"/>
      <rect x="166" y="190" width="9"  height="88" rx="4"/>
      <rect x="242" y="197" width="8"  height="80" rx="4"/>
      <rect x="322" y="206" width="8"  height="72" rx="4"/>
    </g>
    <polygon points="18, 68  -20,210  56,210"  fill="url(#tMid)"/>
    <polygon points="18,112  -16,210  52,210"  fill="url(#tMid)" opacity="0.75"/>
    <polygon points="94, 58   52,201  136,201" fill="url(#tMid)"/>
    <polygon points="94,102   56,201  132,201" fill="url(#tMid)" opacity="0.75"/>
    <polygon points="170, 52  124,195 216,195" fill="url(#tMid)"/>
    <polygon points="170, 96  128,195 212,195" fill="url(#tMid)" opacity="0.75"/>
    <polygon points="246, 60  204,202 288,202" fill="url(#tMid)"/>
    <polygon points="246,104  208,202 284,202" fill="url(#tMid)" opacity="0.75"/>
    <polygon points="326, 68  288,210 364,210" fill="url(#tMid)"/>
    <polygon points="326,112  292,210 360,210" fill="url(#tMid)" opacity="0.75"/>
    <polygon points="18, 68   18,210  56,210"  fill="url(#tShadow)"/>
    <polygon points="94, 58   94,201  136,201" fill="url(#tShadow)"/>
    <polygon points="170, 52  170,195 216,195" fill="url(#tShadow)"/>
    <polygon points="246, 60  246,202 288,202" fill="url(#tShadow)"/>
    <polygon points="326, 68  326,210 364,210" fill="url(#tShadow)"/>

    <!-- === GROUND STRIP === -->
    <path d="M -10,218 C 60,205 140,210 173,212 C 206,214 286,208 356,218 L 356,400 L -10,400 Z"
          fill="#2A4C14"/>
    <path d="M -10,218 C 60,205 140,210 173,212 C 206,214 286,208 356,218
             C 286,222 206,218 173,216 C 140,214 60,209 -10,222 Z"
          fill="#4A7828" opacity="0.4"/>

    <!-- === FRONT TREES === -->
    <g fill="#2A1808">
      <rect x="52"  y="255" width="10" height="95" rx="5"/>
      <rect x="162" y="246" width="11" height="105" rx="5"/>
      <rect x="278" y="253" width="10" height="97" rx="5"/>
    </g>
    <polygon points="57, 100   8,260  106,260"  fill="url(#tFront)"/>
    <polygon points="57, 152  12,260  102,260"  fill="url(#tFront)" opacity="0.8"/>
    <polygon points="167, 90  110,252 224,252"  fill="url(#tFront)"/>
    <polygon points="167,145  114,252 220,252"  fill="url(#tFront)" opacity="0.8"/>
    <polygon points="283, 96  234,258 332,258"  fill="url(#tFront)"/>
    <polygon points="283,150  238,258 328,258"  fill="url(#tFront)" opacity="0.8"/>
    <polygon points="57, 100   57,260 106,260"  fill="url(#tShadow)"/>
    <polygon points="167, 90  167,252 224,252"  fill="url(#tShadow)"/>
    <polygon points="283, 96  283,258 332,258"  fill="url(#tShadow)"/>

  </g>
</svg>
